fullnameOverride: loki

deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    s3:
      region: PLACEHOLDER_AWS_REGION
    bucketNames:
      chunks: PLACEHOLDER_LOKI_S3_BUCKET
      ruler: PLACEHOLDER_LOKI_S3_BUCKET
      admin: PLACEHOLDER_LOKI_S3_BUCKET
  limits_config:
    retention_period: 30d
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_parallelism: 32
    split_queries_by_interval: 15m
    max_streams_per_user: 0
    max_global_streams_per_user: 10000
  compactor:
    retention_enabled: true
    delete_request_store: s3
  query_scheduler:
    max_outstanding_requests_per_tenant: 32768
  server:
    grpc_server_max_recv_msg_size: 8388608
    grpc_server_max_send_msg_size: 8388608

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: PLACEHOLDER_LOKI_IRSA_ROLE_ARN

write:
  replicas: 3
  persistence:
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: write
          topologyKey: topology.kubernetes.io/zone

read:
  replicas: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

backend:
  replicas: 3
  persistence:
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true

test:
  enabled: false

chunksCache:
  enabled: true
  replicas: 1
  allocatedMemory: 1024

resultsCache:
  enabled: true
  replicas: 1
  allocatedMemory: 512
