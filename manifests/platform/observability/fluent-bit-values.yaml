fullnameOverride: fluent-bit

kind: DaemonSet

image:
  repository: fluent/fluent-bit
  tag: 3.1.7

serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true
  nodeAccess: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: NoExecute

priorityClassName: system-node-critical

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s

service:
  type: ClusterIP
  port: 2020

config:
  service: |
    [SERVICE]
        Daemon         Off
        Flush          5
        Log_Level      info
        Parsers_File   parsers.conf
        Parsers_File   custom_parsers.conf
        HTTP_Server    On
        HTTP_Listen    0.0.0.0
        HTTP_Port      2020
        Health_Check   On
        storage.metrics On

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        DB                /var/log/flb_kube.db

    [INPUT]
        Name              systemd
        Tag               host.*
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail    On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Merge_Parser        json
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On
        Buffer_Size         0

    [FILTER]
        Name          modify
        Match         kube.*
        Add           cluster_name PLACEHOLDER_EKS_CLUSTER_NAME

    [FILTER]
        Name          grep
        Match         kube.*
        Exclude       kubernetes_namespace_name (kube-system|argocd|argo-rollouts)

  outputs: |
    [OUTPUT]
        Name                   loki
        Match                  kube.*
        Host                   loki-gateway.monitoring.svc
        Port                   80
        Labels                 job=fluent-bit, cluster=$cluster_name, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], app=$kubernetes['labels']['app.kubernetes.io/name']
        Auto_Kubernetes_Labels off
        Line_Format            json
        Retry_Limit            5
        net.connect_timeout    30
        net.keepalive          on

  customParsers: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On

    [PARSER]
        Name        logback-json
        Format      json
        Time_Key    @timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

env:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

volumeMounts:
  - name: config
    mountPath: /fluent-bit/etc/conf

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true
