apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: challenge-meli

resources:
  - ../../base

configMapGenerator:
  - name: challenge-meli-api-env
    behavior: create
    envs:
      - values.yaml

replicas:
  - name: challenge-meli-api
    count: 1

images:
  - name: challenge-meli-api
    newName: PLACEHOLDER_ECR_REGISTRY/challenge-meli-api
    newTag: PLACEHOLDER_TEST_TAG

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: challenge-meli-api
    patch: |-
      - op: replace
        path: /spec/strategy/blueGreen/autoPromotionEnabled
        value: true
      - op: remove
        path: /spec/strategy/blueGreen/prePromotionAnalysis
      - op: remove
        path: /spec/strategy/blueGreen/postPromotionAnalysis
  - target:
      kind: HorizontalPodAutoscaler
      name: challenge-meli-api
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Ingress
      name: challenge-meli-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: test.challenge-meli.PLACEHOLDER_BASE_DOMAIN
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1scheme
        value: internal
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: PLACEHOLDER_TEST_ACM_CERT_ARN
  - target:
      kind: ExternalSecret
      name: challenge-meli-api-secrets
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: /meli/test/challenge-meli-api
