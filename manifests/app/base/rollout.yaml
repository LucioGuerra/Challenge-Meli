apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: challenge-meli-api
  namespace: challenge-meli
  labels:
    app.kubernetes.io/name: challenge-meli-api
    app.kubernetes.io/part-of: challenge-meli
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: challenge-meli-api
  strategy:
    blueGreen:
      activeService: challenge-meli-api-active
      previewService: challenge-meli-api-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 60
      abortScaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: challenge-meli-api-smoke-test
        args:
          - name: preview-service
            value: challenge-meli-api-preview
      postPromotionAnalysis:
        templates:
          - templateName: challenge-meli-api-error-rate
        args:
          - name: service
            value: challenge-meli-api-active
  template:
    metadata:
      labels:
        app.kubernetes.io/name: challenge-meli-api
        app.kubernetes.io/part-of: challenge-meli
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: challenge-meli-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: challenge-meli-api:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseZGC -XX:+ExitOnOutOfMemoryError"
          envFrom:
            - configMapRef:
                name: challenge-meli-api-env
            - secretRef:
                name: challenge-meli-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: challenge-meli-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: challenge-meli-api
  namespace: challenge-meli
  labels:
    app.kubernetes.io/name: challenge-meli-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: challenge-meli-api
